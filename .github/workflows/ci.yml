name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path nostd-test/Cargo.toml --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7m-none-eabi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --manifest-path nostd-test/Cargo.toml --target thumbv7m-none-eabi --all-targets -- -D warnings

  test:
    name: test, doc, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -- --test-threads=1
      - run: cargo doc --no-deps
      - run: cargo run --example helloworld
      - run: cargo run --example futures_chain
      - run: cargo run --example multi_async_std
      - run: cargo run --example signal

  msrv:
    name: msrv 1.63
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.63.0
        with:
          targets: wasm32-unknown-unknown,thumbv7m-none-eabi
      - name: library and no_std targets on 1.63
        run: |
          # `cargo test` also builds the async-std example stack, whose current
          # crates need a newer rustc. The library itself does not.
          cargo build --lib
          cargo check --target wasm32-unknown-unknown --lib
          cargo check --target thumbv7m-none-eabi --lib

  nostd:
    name: no_std build and qemu
    runs-on: ubuntu-latest
    # Bound a hang in apt or QEMU. The runner's own limit is 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,thumbv7m-none-eabi
      - name: install qemu
        run: |
          # Runner images list http://azure.archive.ubuntu.com at priority 1 and
          # https://archive.ubuntu.com at priority 2 (mirror+file:/etc/apt/apt-mirrors.txt).
          # On master run 37679549289 Azure ignored InRelease, then apt printed Ign for
          # noble-updates Packages from that host and never logged another line. It did
          # not fail over, and GitHub cancelled the job 6 hours later. The build and
          # QEMU never started. The same run had already fetched InRelease from
          # archive.ubuntu.com, so use that mirror only. Acquire timeouts plus
          # `timeout` cover a later stall that apt itself does not abort.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo find /etc/apt -type f \( -name 'sources.list' -o -name '*.list' -o -name '*.sources' \) -print0 |
            sudo xargs -0 -r sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "3";' |
            sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          run_apt() {
            if ! sudo timeout -k 20 180 "$@"; then
              status=$?
              if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
                echo "apt hung: $* (killed after 180s)"
                exit 1
              fi
              exit "$status"
            fi
          }
          run_apt apt-get update
          run_apt apt-get install -y qemu-system-arm
      - name: check library on no_std targets
        run: |
          cargo check --target wasm32-unknown-unknown --lib
          cargo check --target thumbv7m-none-eabi --lib
      - name: run bare-metal tests under qemu
        run: |
          cargo build --manifest-path nostd-test/Cargo.toml --release --target thumbv7m-none-eabi
          # The guest exits through semihosting SYS_EXIT. Kill a guest that never does.
          if ! timeout -k 5 60 qemu-system-arm \
            -cpu cortex-m3 \
            -machine lm3s6965evb \
            -nographic \
            -semihosting-config enable=on,target=native \
            -kernel nostd-test/target/thumbv7m-none-eabi/release/executor-nostd-test
          then
            status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "qemu did not exit within 60s; semihosting exit never arrived"
              exit 1
            fi
            exit "$status"
          fi

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test -- --test-threads=1
